    <canvas id="bg-canvas"></canvas>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, time = 0;
        const mouse = { x: -1000, y: -1000 };
        const config = { gridSize: 8, gap: 2, waveSpeed: 0.10, mouseRadius: 80, mouseForce: 1.2 };

        function noise2D(x, y) {
          return (Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1;
        }

        function smoothNoise(x, y) {
          const ix = Math.floor(x), iy = Math.floor(y);
          const fx = x - ix, fy = y - iy;
          const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
          const a = noise2D(ix, iy) + sx * (noise2D(ix + 1, iy) - noise2D(ix, iy));
          const b = noise2D(ix, iy + 1) + sx * (noise2D(ix + 1, iy + 1) - noise2D(ix, iy + 1));
          return a + sy * (b - a);
        }

        function getOffset(x, y) { return smoothNoise(x, y) * 2 - 1; }

        function smoothOrganic(x, y, t) {
          const bf = 0.015, w1 = Math.sin(x * bf * 0.7 + y * bf * 0.8 + t * 0.01);
          const w2 = Math.cos(y * bf * 1.2 - x * bf * 0.5 + t * 0.012);
          const o1 = getOffset(x * 0.05, y * 0.05);
          const lw1 = Math.sin(x * 0.025 + y * 0.015 + t * 0.02 + o1);
          const lw2 = Math.cos((x - y) * 0.012 + t * 0.015);
          const detail = Math.sin(x * 0.06 + o1 * 0.5) * Math.sin(y * 0.04 + t * 0.025) * 0.12;
          return w1 * 0.35 + w2 * 0.25 + lw1 * 0.2 + lw2 * 0.15 + detail;
        }

        function draw() {
          ctx.fillStyle = '#f8f9fa';
          ctx.fillRect(0, 0, width, height);
          const cellSize = config.gridSize + config.gap;
          const cols = Math.ceil(width / cellSize) + 1, rows = Math.ceil(height / cellSize) + 1;
          for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
              const x = i * cellSize, y = j * cellSize;
              let value = smoothOrganic(x, y, time);
              const dx = x - mouse.x, dy = y - mouse.y, dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < config.mouseRadius && dist > 0) {
                const force = (1 - dist / config.mouseRadius) * config.mouseForce;
                value += Math.sin(dist * 0.05 - time * 0.12) * force * 0.5;
              }
              value = (value + 1.2) / 2.4;
              if (value > 0.52) {
                const size = config.gridSize;
                if (value > 0.72) {
                  const intensity = (value - 0.72) / 0.28;
                  const brightness = Math.floor(180 + intensity * 50);
                  ctx.fillStyle = `rgba(${brightness},${brightness},${brightness},0.5)`;
                } else {
                  const intensity = (value - 0.52) / 0.2;
                  const gray = Math.floor(200 - intensity * 20);
                  ctx.fillStyle = `rgba(${gray},${gray},${gray},0.35)`;
                }
                ctx.fillRect(x, y, size, size);
              }
            }
          }
        }

        function animate() { time += config.waveSpeed; draw(); requestAnimationFrame(animate); }
        function resize() {
          width = window.innerWidth; height = window.innerHeight;
          canvas.width = width; canvas.height = height;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', function(e) { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseleave', function() { mouse.x = -1000; mouse.y = -1000; });

        resize(); animate();
      })();
    </script>
